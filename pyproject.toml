# uv workspace root (virtual, no code). Brief §12.2.
[tool.uv.workspace]
members = ["backend", "ml"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio", "respx", "black>=24", "pylint>=3"]

[tool.pytest.ini_options]
testpaths = ["ml/tests", "backend/tests"]
pythonpath = ["backend/app"]  # backend imports are `from core.config import ...` (brief rule 6)
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "contract: ML -> Backend contract tests (brief §13.2), parametrised by --bundle/--data",
    "db: needs the local PostGIS from `make db-up` (skipped when it is not reachable)",
    "integration: counted risks on the REAL tables in the dev database (PLAN_40); skipped without them",
]
addopts = "-ra"

[tool.black]
line-length = 100
target-version = ["py312"]
