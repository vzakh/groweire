# Local dev stack for the backend track: PostGIS + Redis.
# Own project name and non-default host ports, so it never collides with other stacks.
name: agrolens-backend

services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64 # the official image has no arm64 build; emulated on Apple Silicon
    environment:
      POSTGRES_USER: agrolens
      POSTGRES_PASSWORD: agrolens # dev only; prod reads .envs/.prod (never committed)
      POSTGRES_DB: agrolens
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrolens -d agrolens"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
